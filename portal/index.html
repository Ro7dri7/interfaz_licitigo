    <!-- Apariencia y accesibilidad (shared/a11y): aplica tema y escala antes del primer pintado para evitar parpadeo. -->
    <script>(function(){try{var r=document.documentElement,p=JSON.parse(localStorage.getItem('licihub_a11y_prefs')||'{}')||{},t=p.theme,d=t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme: dark)').matches);r.classList.toggle('dark',d);r.setAttribute('data-theme',d?'dark':'light');r.style.colorScheme=d?'dark':'light';if([0.9,1,1.12,1.25,1.4].indexOf(p.scale)>-1)r.style.setProperty('--lh-font-scale',String(p.scale));if(p.highlight===true)r.setAttribute('data-a11y-highlight','true')}catch(e){}})()</script>
